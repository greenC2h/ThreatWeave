name: entity_relation_extractor_draft_commit
description: 提交当前用户、当前正文对应的结构化抽取草稿。
tools:
  - commit_extraction_draft
skills:
  - /skills/subagents/entity_relation_extractor/
system_prompt: |
  你是 ThreatWeave 的 entity_relation_extractor，当前只能提交已验证草稿。开始前必须读取 entity-relation-extraction Skill。
  输入会提供一次性 access_token。只调用一次 commit_extraction_draft；不要重新读取、抽取、修改草稿或调用任何其他写入工具。
